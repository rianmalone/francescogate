<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<title>…</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: ui-monospace, "Courier New", monospace; color: #e6f2ff;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }

  /* faint scanline veil */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 40; opacity: 0.5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px);
  }

  /* ---------- the slide puzzle ---------- */
  #puzzle {
    position: relative; border-radius: 8px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    transition: box-shadow .8s ease, opacity .8s ease, transform .8s ease, filter .8s ease;
  }
  .tile {
    position: absolute; left: 0; top: 0; background-repeat: no-repeat;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.55);
    transition: transform .16s cubic-bezier(.3,.7,.3,1); cursor: pointer;
  }
  #puzzle.solved { box-shadow: 0 0 44px 6px rgba(56,224,255,0.55); }
  #puzzle.solved .tile { box-shadow: none; }

  /* ---------- opening riddle (before the puzzle) ---------- */
  #riddle {
    position: fixed; inset: 0; z-index: 12; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 34px 26px;
    transition: opacity .8s ease, transform .8s ease;
  }
  #riddle.gone { opacity: 0; transform: scale(0.92); pointer-events: none; }
  .r-q { font-size: clamp(0.95rem, 4.4vw, 1.2rem); line-height: 1.55; color: #e6f2ff; max-width: 520px; text-shadow: 0 0 16px rgba(56,224,255,0.22); }
  .r-it { margin-top: 12px; font-size: clamp(0.72rem, 3.2vw, 0.85rem); line-height: 1.5; color: #4a5670; font-style: italic; max-width: 480px; }
  .r-label { margin-top: 26px; color: #52627a; font-size: 0.74rem; letter-spacing: 0.22em; }
  #rInput {
    margin-top: 12px; font-family: inherit; text-align: center; width: min(78vw, 280px); font-size: 1.15rem;
    background: #050a10; border: 1px solid #23405e; color: #e6f2ff; border-radius: 9px; padding: 12px 14px;
  }
  #rInput:focus { outline: none; border-color: #38e0ff; box-shadow: 0 0 12px rgba(56,224,255,0.3); }
  #rInput.wrong { border-color: #ff3b5c; animation: rShake .35s; }
  @keyframes rShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  #rGo {
    margin-top: 14px; font-family: inherit; cursor: pointer; font-size: 1.1rem; font-weight: 800;
    color: #04160c; background: linear-gradient(#5effa6, #21c46e); border: 1px solid #baffd6;
    border-radius: 10px; padding: 10px 26px; box-shadow: 0 0 20px rgba(56,224,138,0.5);
  }
  .r-msg { min-height: 1.3em; margin-top: 14px; font-size: 0.82rem; color: #ff6b81; letter-spacing: 0.05em; }
  /* koalastothemax-style reveal: circles split under your finger until the words resolve */
  #koala {
    display: block; border-radius: 10px; touch-action: none; cursor: crosshair;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 0 46px rgba(0,0,0,0.65);
  }
  .k-hint {
    margin-top: 18px; font-size: 0.7rem; letter-spacing: 0.32em; text-transform: uppercase;
    color: #3a475c; transition: opacity .5s ease; animation: cuePulse 1.8s ease-in-out infinite;
  }
  .k-hint.gone { opacity: 0; animation: none; pointer-events: none; }
  .k-answer {
    margin-top: 20px; display: flex; flex-direction: column; align-items: center;
  }

  /* ---------- "Ciao, Francesco." beat ---------- */
  #ciao {
    position: fixed; left: 0; right: 0; bottom: 9%; text-align: center; padding: 0 26px;
    opacity: 0; transition: opacity 1.1s ease; pointer-events: none; z-index: 10;
  }
  #ciao.show { opacity: 1; }
  .ciao-text {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive; font-style: italic;
    font-size: clamp(2rem, 10vw, 3rem); color: #fff; text-shadow: 0 0 24px rgba(56,224,255,0.6);
  }
  .ciao-cue { margin-top: 18px; font-size: 0.72rem; letter-spacing: 0.3em; color: #52627a; opacity: 0; }
  .ciao-cue.show { opacity: 1; animation: cuePulse 1.6s ease-in-out infinite; }
  @keyframes cuePulse { 0%,100%{ opacity: .25; } 50%{ opacity: .8; } }

  /* fade the puzzle + ciao away when moving to the question */
  #stage.leaving #puzzle { opacity: 0; transform: scale(0.86); filter: blur(6px); }
  #stage.leaving #ciao { opacity: 0; }

  /* ---------- the ominous question ---------- */
  #question { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 20; padding: 30px; }
  #question.show { display: flex; }
  /* pulsing blood-red vignette */
  .q-vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 50%, transparent 42%, rgba(150,0,0,0.5) 100%);
    opacity: 0; }
  #question.show .q-vignette { animation: vigIn 1.2s ease .1s forwards, vigPulse 3.4s ease-in-out 1.4s infinite; }
  @keyframes vigIn { to { opacity: 1; } }
  @keyframes vigPulse { 0%,100%{ opacity: .55; } 50%{ opacity: 1; } }

  .q-text {
    position: relative; text-align: center; font-size: clamp(1.4rem, 6.5vw, 2rem); font-weight: 700;
    line-height: 1.4; color: #fff; max-width: 640px; letter-spacing: 0.02em;
    text-shadow: 0 0 18px rgba(255,60,60,0.35); opacity: 0;
  }
  #question.show .q-text { animation: qTextIn 1.6s cubic-bezier(.2,.7,.2,1) .5s both; }
  @keyframes qTextIn {
    0% { opacity: 0; transform: translateY(14px) scale(0.96); letter-spacing: 0.4em; filter: blur(6px); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: none; letter-spacing: 0.02em; filter: blur(0); }
  }
  .q-it { position: relative; text-align: center; font-size: 0.82rem; font-style: italic; color: #7b8aa0; margin-top: 12px; opacity: 0; }
  #question.show .q-it { animation: fadeIn 1s ease 1.6s both; }
  @keyframes fadeIn { to { opacity: 1; } }

  .q-choices { position: relative; display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: 52px; opacity: 0; }
  #question.show .q-choices { animation: fadeUp 1s ease 2s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

  /* YES — big, green, glowing, inviting */
  #qYes {
    font-family: inherit; cursor: pointer; font-weight: 900; letter-spacing: 0.14em;
    font-size: clamp(1.8rem, 9vw, 2.6rem); padding: 20px 64px; border-radius: 16px;
    color: #04160c; background: linear-gradient(#5effa6, #21c46e); border: 2px solid #baffd6;
    box-shadow: 0 0 34px 6px rgba(56,224,138,0.7);
    animation: yesPulse 1.5s ease-in-out infinite;
  }
  @keyframes yesPulse {
    0%,100%{ transform: scale(1); box-shadow: 0 0 30px 4px rgba(56,224,138,0.6); }
    50%    { transform: scale(1.05); box-shadow: 0 0 46px 10px rgba(56,224,138,0.9); }
  }
  /* NO — tiny, red, discreet */
  #qNo {
    font-family: inherit; cursor: pointer; font-weight: 700; letter-spacing: 0.05em;
    font-size: 0.72rem; padding: 5px 12px; border-radius: 7px;
    color: #b5566a; background: transparent; border: 1px solid rgba(150,40,60,0.5); opacity: 0.6;
  }
  #qNo:active { opacity: 0.9; }

  /* the "no" shield: slams in HUGE, then fades */
  .q-shield {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0.2); z-index: 30;
    font-size: 46vh; opacity: 0; pointer-events: none;
    filter: drop-shadow(0 0 40px rgba(255,0,0,0.6));
  }
  .q-shield.hit { animation: shieldHit 1.3s cubic-bezier(.2,1.4,.3,1) forwards; }
  @keyframes shieldHit {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.2); }
    18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    30%  { transform: translate(-50%,-50%) scale(1); }
    75%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); }
  }

  /* ---------- final: continue on a computer ---------- */
  #final { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 25; padding: 30px; text-align: center; }
  #final.show { display: flex; animation: fadeIn 1.4s ease both; }
  .final-hi {
    font-family: "Snell Roundhand", "Segoe Script", "Brush Script MT", cursive; font-style: italic;
    font-size: clamp(2rem, 10vw, 3rem); color: #fff; text-shadow: 0 0 22px rgba(56,224,255,0.6);
    opacity: 0; animation: fadeUp 1.2s ease .3s both;
  }
  .final-sub { font-size: clamp(1rem, 4.6vw, 1.2rem); color: #7dffa8; font-weight: 800; margin-top: 16px; text-shadow: 0 0 14px rgba(56,224,138,0.45); opacity: 0; animation: fadeUp 1.2s ease 1.1s both; }
  .final-it { font-size: 0.8rem; font-style: italic; color: #5c6784; margin-top: 6px; opacity: 0; animation: fadeIn 1.2s ease 1.7s both; }

  /* black flash used between beats */
  #flash { position: fixed; inset: 0; background: #000; z-index: 35; opacity: 0; pointer-events: none; transition: opacity .5s ease; }
  #flash.on { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <div id="riddle" style="display:none;">
      <canvas id="koala" width="380" height="380"></canvas>
      <div class="k-hint" id="kHint">drag to reveal</div>
      <div class="k-answer" id="kAnswer">
        <div class="r-label">answer in one word</div>
        <input id="rInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…" />
        <div><button id="rGo">↵</button></div>
        <div class="r-msg" id="rMsg"></div>
      </div>
    </div>
    <div id="puzzle"></div>
    <div id="ciao">
      <div class="ciao-text">Ciao, Francesco.</div>
      <div class="ciao-cue" id="ciaoCue">tap to continue</div>
    </div>
    <div id="question">
      <div class="q-vignette"></div>
      <div class="q-text">Do you want to take an imaginary trip to Sweden?</div>
      <div class="q-it">Vuoi fare un viaggio immaginario in Svezia?</div>
      <div class="q-choices">
        <button id="qYes">YES</button>
        <button id="qNo">no</button>
      </div>
      <div class="q-shield" id="qShield">🛡️</div>
    </div>
    <div id="final">
      <div class="final-hi">Andiamo.</div>
      <div class="final-sub">Now open the gate on a computer.</div>
      <div class="final-it">Ora apri il cancello su un computer.</div>
    </div>
  </div>
  <div id="flash"></div>

<script>
(function () {
  const N = 3, IMG = "assets/francesco.jpg";
  const stage = document.getElementById("stage");
  const wrap = document.getElementById("puzzle");
  const ciao = document.getElementById("ciao");
  const ciaoCue = document.getElementById("ciaoCue");
  const question = document.getElementById("question");
  const shield = document.getElementById("qShield");
  const finalEl = document.getElementById("final");
  const flash = document.getElementById("flash");
  const EMPTY = N * N - 1;
  let cell = 0, size = 0, board = [], tiles = [], solved = false;
  let state = "puzzle", canAdvance = false, koalaOn = false, cheatTaps = 0;

  const xy = i => [i % N, Math.floor(i / N)];
  const neighbors = p => { const [x, y] = xy(p), r = []; if (x > 0) r.push(p - 1); if (x < N - 1) r.push(p + 1); if (y > 0) r.push(p - N); if (y < N - 1) r.push(p + N); return r; };
  const isSolved = () => board.every((t, i) => t === i);

  function build() {
    size = Math.round(Math.min(window.innerWidth * 0.84, window.innerHeight * 0.62, 380));
    cell = Math.floor(size / N); size = cell * N;
    wrap.style.width = wrap.style.height = size + "px"; wrap.innerHTML = ""; wrap.classList.remove("solved");
    tiles = []; solved = false;
    for (let t = 0; t < N * N - 1; t++) {
      const d = document.createElement("div"); d.className = "tile";
      d.style.width = d.style.height = cell + "px";
      d.style.backgroundImage = "url(" + IMG + ")";
      d.style.backgroundSize = size + "px " + size + "px";
      d.style.backgroundPosition = "-" + (t % N) * cell + "px -" + Math.floor(t / N) * cell + "px";
      d.addEventListener("click", () => tap(t));
      wrap.appendChild(d); tiles[t] = d;
    }
    board = [...Array(N * N).keys()]; shuffle(); place();
  }
  function place() { for (let pos = 0; pos < board.length; pos++) { const id = board[pos]; if (id === EMPTY) continue; const [x, y] = xy(pos); tiles[id].style.transform = "translate(" + x * cell + "px," + y * cell + "px)"; } }
  function shuffle() { let e = board.indexOf(EMPTY), last = -1; for (let i = 0; i < 60; i++) { const ns = neighbors(e).filter(n => n !== last); const pick = ns[Math.floor(Math.random() * ns.length)];[board[e], board[pick]] = [board[pick], board[e]]; last = e; e = pick; } if (isSolved()) shuffle(); }
  function tap(id) { if (solved) return; const pos = board.indexOf(id), e = board.indexOf(EMPTY); if (!neighbors(pos).includes(e)) return;[board[pos], board[e]] = [board[e], board[pos]]; place(); if (isSolved()) win(); }

  // Skip cheat: tap the EMPTY top-left cell 10x (blank must be sitting in the corner).
  function skipPuzzle() { if (solved) return; board = [...Array(N * N).keys()]; place(); win(); }
  wrap.addEventListener("click", (e) => {
    if (solved || state !== "puzzle") return;
    if (e.target === wrap && board[0] === EMPTY) {          // clicked the empty background
      const rect = wrap.getBoundingClientRect();
      const cx = Math.floor((e.clientX - rect.left) / cell), cy = Math.floor((e.clientY - rect.top) / cell);
      if (cx === 0 && cy === 0) { if (++cheatTaps >= 10) { cheatTaps = 0; skipPuzzle(); } return; }
    }
    cheatTaps = 0;
  });

  function win() {
    solved = true; state = "ciao";
    // complete the face
    const d = document.createElement("div"); d.className = "tile";
    d.style.width = d.style.height = cell + "px"; d.style.backgroundImage = "url(" + IMG + ")";
    d.style.backgroundSize = size + "px " + size + "px";
    d.style.backgroundPosition = "-" + (EMPTY % N) * cell + "px -" + Math.floor(EMPTY / N) * cell + "px";
    const [x, y] = xy(board.indexOf(EMPTY)); d.style.transform = "translate(" + x * cell + "px," + y * cell + "px)";
    d.style.opacity = "0"; d.style.transition = "opacity .7s ease"; wrap.appendChild(d);
    requestAnimationFrame(() => { d.style.opacity = "1"; wrap.classList.add("solved"); });
    // "Ciao, Francesco." — then the 5s lock before you can continue
    setTimeout(() => ciao.classList.add("show"), 1400);
    setTimeout(() => { canAdvance = true; ciaoCue.classList.add("show"); }, 1400 + 5000);
  }

  // tap anywhere (after the 5s) to move on from "Ciao" -> the koala reveal
  document.addEventListener("click", (e) => {
    if (state === "ciao" && canAdvance) { showKoala(); }
  });

  // 3x3 solved + greeted -> bring in the koalastothemax reveal
  function showKoala() {
    state = "koala";
    stage.classList.add("leaving");             // puzzle + ciao blur away
    flash.classList.add("on");                   // ominous black swallow
    setTimeout(() => {
      wrap.style.display = "none"; ciao.style.display = "none";
      riddle.style.display = "flex"; riddle.classList.remove("gone");
      koalaOn = true;
      sizeCanvas();                              // crisp at the current viewport
      flash.classList.remove("on");              // reveal the circles from black
    }, 850);
  }

  // koala answered -> the ominous Sweden question
  function toQuestion() {
    state = "transition"; koalaOn = false;
    flash.classList.add("on");
    setTimeout(() => {
      riddle.classList.add("gone"); riddle.style.display = "none";
      question.classList.add("show");
      state = "question";
      flash.classList.remove("on");
    }, 700);
  }

  document.getElementById("qYes").addEventListener("click", (e) => {
    e.stopPropagation();
    if (state !== "question") return;
    state = "final";
    flash.classList.add("on");
    setTimeout(() => { question.classList.remove("show"); question.style.display = "none"; finalEl.classList.add("show"); flash.classList.remove("on"); }, 700);
  });

  // NO does nothing — except a giant shield slams in
  document.getElementById("qNo").addEventListener("click", (e) => {
    e.stopPropagation();
    if (state !== "question") return;
    shield.classList.remove("hit"); void shield.offsetWidth; shield.classList.add("hit");
  });

  // ---- koalastothemax-style reveal (shown AFTER the 3x3 puzzle) ----
  // The real question lives in the physical puzzle box Ryan hands over. On screen,
  // one big circle splits into four under your finger, over and over, until the
  // hidden words "ASK RYAN FOR THE PUZZLE" resolve. The answer field is always there.
  const riddle = document.getElementById("riddle");
  const rInput = document.getElementById("rInput");
  const rGo = document.getElementById("rGo");
  const rMsg = document.getElementById("rMsg");
  const canvas = document.getElementById("koala");
  const ctx = canvas.getContext("2d");
  const kHint = document.getElementById("kHint");
  const kAnswer = document.getElementById("kAnswer");
  const RIDDLE_ANSWERS = ["keyboard", "tastiera"];
  const MAXD = 7;                                   // 2^7 = 128x128 leaves at full split
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  let dragging = false;
  let root = null, leaves = [], raf = 0, DSP = 0;

  // ---- hidden message baked into an offscreen canvas + integral image for O(1) averages ----
  const SN = 256, IW = SN + 1;
  const sr = new Float64Array(IW * IW), sg = new Float64Array(IW * IW), sb = new Float64Array(IW * IW);
  function buildSource() {
    const c = document.createElement("canvas"); c.width = c.height = SN;
    const g = c.getContext("2d");
    g.fillStyle = "#0a0e13"; g.fillRect(0, 0, SN, SN);
    const lines = ["FRÅGA RYAN", "OM", "PUSSLET"];   // Swedish: "ask Ryan for the puzzle"
    let fs = SN * 0.2;
    g.font = "900 " + fs + "px Arial, Helvetica, sans-serif";
    const maxw = Math.max.apply(null, lines.map(t => g.measureText(t).width));
    fs = fs * (SN * 0.86) / maxw;                   // scale so the widest line fills 86%
    g.font = "900 " + fs + "px Arial, Helvetica, sans-serif";
    g.fillStyle = "#eaf6ff"; g.textAlign = "center"; g.textBaseline = "middle";
    const lh = fs * 1.15;
    lines.forEach((t, i) => g.fillText(t, SN / 2, SN / 2 + (i - 1) * lh));
    const d = g.getImageData(0, 0, SN, SN).data;
    for (let y = 0; y < SN; y++) for (let x = 0; x < SN; x++) {
      const p = (y * SN + x) * 4, i = (y + 1) * IW + (x + 1);
      sr[i] = d[p]     + sr[i-1] + sr[i-IW] - sr[i-IW-1];
      sg[i] = d[p + 1] + sg[i-1] + sg[i-IW] - sg[i-IW-1];
      sb[i] = d[p + 2] + sb[i-1] + sb[i-IW] - sb[i-IW-1];
    }
  }
  function avgColor(nx, ny, ns) {                   // average colour of a normalized square
    let x = Math.round(nx * SN), y = Math.round(ny * SN),
        x2 = Math.round((nx + ns) * SN), y2 = Math.round((ny + ns) * SN);
    x = Math.max(0, Math.min(SN, x)); y = Math.max(0, Math.min(SN, y));
    x2 = Math.max(0, Math.min(SN, x2)); y2 = Math.max(0, Math.min(SN, y2));
    const n = Math.max(1, (x2 - x) * (y2 - y));
    const A = y * IW + x, B = y * IW + x2, C = y2 * IW + x, D = y2 * IW + x2;
    return [(sr[D]-sr[B]-sr[C]+sr[A]) / n, (sg[D]-sg[B]-sg[C]+sg[A]) / n, (sb[D]-sb[B]-sb[C]+sb[A]) / n];
  }
  function makeNode(x, y, s, depth) {
    const c = avgColor(x, y, s);
    return { x: x, y: y, s: s, depth: depth, r: c[0], g: c[1], b: c[2], children: null };
  }
  function splitNode(nd) {
    if (nd.children || nd.depth >= MAXD) return false;
    const h = nd.s / 2, d = nd.depth + 1;
    nd.children = [ makeNode(nd.x, nd.y, h, d), makeNode(nd.x + h, nd.y, h, d),
                    makeNode(nd.x, nd.y + h, h, d), makeNode(nd.x + h, nd.y + h, h, d) ];
    const i = leaves.indexOf(nd);
    if (i >= 0) leaves.splice(i, 1, nd.children[0], nd.children[1], nd.children[2], nd.children[3]);
    return true;
  }
  function leafAt(nx, ny) {
    let nd = root;
    while (nd.children) nd = nd.children[(ny >= nd.y + nd.s / 2 ? 2 : 0) + (nx >= nd.x + nd.s / 2 ? 1 : 0)];
    return nd;
  }
  function render() {
    ctx.clearRect(0, 0, DSP, DSP);
    for (let i = 0; i < leaves.length; i++) {
      const nd = leaves[i];
      ctx.beginPath();
      ctx.arc((nd.x + nd.s / 2) * DSP, (nd.y + nd.s / 2) * DSP, (nd.s * DSP / 2) * 0.94, 0, 6.2832);
      ctx.fillStyle = "rgb(" + (nd.r | 0) + "," + (nd.g | 0) + "," + (nd.b | 0) + ")";
      ctx.fill();
    }
  }
  function scheduleRender() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }
  function sizeCanvas() {
    DSP = Math.round(Math.min(window.innerWidth * 0.84, window.innerHeight * 0.62, 380));
    canvas.style.width = canvas.style.height = DSP + "px";
    canvas.width = canvas.height = Math.round(DSP * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    render();
  }
  function onPointer(e) {
    if (!koalaOn) return;
    const rect = canvas.getBoundingClientRect();
    const nx = (e.clientX - rect.left) / rect.width, ny = (e.clientY - rect.top) / rect.height;
    if (nx < 0 || ny < 0 || nx > 1 || ny > 1) return;
    if (splitNode(leafAt(nx, ny))) {
      if (!kHint.classList.contains("gone")) kHint.classList.add("gone");
      scheduleRender();
    }
  }

  buildSource();
  root = makeNode(0, 0, 1, 0); leaves = [root];
  sizeCanvas();
  build();                                          // the 3x3 puzzle is the FIRST screen
  canvas.addEventListener("pointerdown", e => { dragging = true; try { canvas.setPointerCapture(e.pointerId); } catch (x) {} onPointer(e); });
  canvas.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || dragging) onPointer(e); });
  window.addEventListener("pointerup", () => { dragging = false; });

  function checkRiddle() {
    if (!koalaOn) return;
    const v = (rInput.value || "").toLowerCase().replace(/[^a-z]/g, "");
    if (RIDDLE_ANSWERS.includes(v)) {
      rMsg.textContent = "";
      toQuestion();                           // -> the ominous Sweden question
    } else {
      rMsg.textContent = "not quite…"; rInput.classList.add("wrong");
      setTimeout(() => rInput.classList.remove("wrong"), 380);
    }
  }
  rGo.addEventListener("click", checkRiddle);
  rInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkRiddle(); } });

  let rt; window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (koalaOn) sizeCanvas(); else if (state === "puzzle" && !solved) build(); }, 250);
  });
})();
</script>
</body>
</html>
